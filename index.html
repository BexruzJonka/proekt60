<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-orange-400 to-orange-700 h-screen flex items-center justify-center m-0">

    <div class="bg-orange-400 p-6 rounded-xl flex gap-4 shadow-2xl">
      
      <div class="bg-[#1a1410] text-white p-6 rounded-lg text-center min-w-[100px] shadow-inner">
        <span id="hours" class="block text-5xl font-bold tracking-tighter">00</span>
        <p class="text-xs opacity-60 mt-2 uppercase">Hours</p>
      </div>
  
      <div class="bg-[#1a1410] text-white p-6 rounded-lg text-center min-w-[100px] shadow-inner">
        <span id="minutes" class="block text-5xl font-bold tracking-tighter">00</span>
        <p class="text-xs opacity-60 mt-2 uppercase">Minutes</p>
      </div>
  
      <div class="bg-[#1a1410] text-white p-6 rounded-lg text-center min-w-[100px] shadow-inner">
        <span id="seconds" class="block text-5xl font-bold tracking-tighter">00</span>
        <p class="text-xs opacity-60 mt-2 uppercase">Seconds</p>
      </div>
  
    </div>
  
    <script src="main.js"></script>
  </body>
</html>
